# Builds the Android app (a Capacitor shell that opens the web app) and publishes the APK
# at a fixed link: https://github.com/suborhan7/cricket-scoring-app/releases/tag/android-latest
name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    paths: [capacitor.config.json, android-assets/**, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        # The push notifications plugin comes in once the repository secret GOOGLE_SERVICES_JSON
        # (the google-services.json file from Firebase) is added: then the app gets wicket and
        # result alerts as Android notifications.
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          PKGS="@capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 @capacitor/splash-screen@7 @capacitor/assets@3"
          if [ -n "$GSJ" ]; then PKGS="$PKGS @capacitor/push-notifications@7"; fi
          npm install --no-save $PKGS
      - name: Copy the web app
        run: |
          mkdir -p www
          cp -r index.html privacy.html manifest.webmanifest icon.svg sw.js css js vendor icons www/
          cp android-assets/offline.html www/
      - name: Create the Android project
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npx cap add android
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; fi
          npx @capacitor/assets generate --android --assetPath android-assets --iconBackgroundColor '#0E1A14' --iconBackgroundColorDark '#0E1A14' --splashBackgroundColor '#0E1A14' --splashBackgroundColorDark '#0E1A14'
          npx cap sync android
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        # cricket-scorer.apk is the old name; it stays so links already shared keep working.
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cricpulse.apk
          cp cricpulse.apk cricket-scorer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cricpulse-apk
          path: cricpulse.apk
      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Android app (latest)" --notes "Install on Android: download cricpulse.apk, open it, and allow installing from this source when asked. Rebuilt on every update." --prerelease
          gh release upload android-latest cricpulse.apk cricket-scorer.apk --clobber
