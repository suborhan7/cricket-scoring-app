# Free Supabase projects pause after 7 days with no activity.
# This runs a tiny read twice a week so the project stays awake.
# It uses the public (publishable) key that is already in js/config.js.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * 1,4" # Monday and Thursday, 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            -H "apikey: sb_publishable_lrQQ49m6cessvzu1yqaXoA_SBv44JEh" \
            "https://hlditboaogmrkxmwmyqu.supabase.co/rest/v1/tournaments?select=id&limit=1" \
            -o /dev/null -w "HTTP %{http_code}\n"
